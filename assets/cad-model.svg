<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <!-- Precision 3D CAD Mechanical Solid Model -->
  <g id="hidden-edges" stroke="#252d3d" stroke-width="1.2" stroke-dasharray="3 3">
    <!-- Back base edges -->
    <path d="M 52 138 L 160 76 L 268 138" />
    <path d="M 160 76 L 160 104" />
  </g>

  <!-- Base block -->
  <!-- Left front face -->
  <polygon points="52,138 160,200 160,224 52,162" fill="#1b202b" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Right front face -->
  <polygon points="160,200 268,138 268,162 160,224" fill="#141822" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Top base face -->
  <polygon points="160,76 268,138 160,200 52,138" fill="#242b3a" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Extruded solid feature / step -->
  <!-- Left side of extruded pillar -->
  <polygon points="116,102 160,127 160,65 116,40" fill="#202735" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Right side of extruded pillar -->
  <polygon points="160,127 204,102 204,40 160,65" fill="#171c26" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Top active extruded face (selected in cyan) -->
  <polygon points="160,15 204,40 160,65 116,40" fill="#162e3d" stroke="#00e8ff" stroke-width="2" stroke-linejoin="round" />

  <!-- Cylindrical pocket / bore on active face -->
  <ellipse cx="160" cy="40" rx="20" ry="11" fill="#0c1017" stroke="#00e8ff" stroke-width="1.5" />
  <!-- Bore depth curve -->
  <path d="M 140 40 A 20 11 0 0 0 180 40" stroke="#00e8ff" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Extrusion direction vector indicator -->
  <g stroke="#00e8ff" stroke-width="1.5">
    <line x1="160" y1="40" x2="160" y2="12" />
    <polyline points="156,18 160,10 164,18" fill="none" stroke-linejoin="round" />
  </g>

  <!-- Vertex handles on selected face -->
  <g fill="#00e8ff">
    <circle cx="160" cy="15" r="2.5" />
    <circle cx="204" cy="40" r="2.5" />
    <circle cx="160" cy="65" r="2.5" />
    <circle cx="116" cy="40" r="2.5" />
  </g>
</svg>
