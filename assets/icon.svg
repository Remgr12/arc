<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    arc app icon — rounded square background of the same scheme used in the app,
    with the 270 degree ring mark on top.
  -->
  <title>arc</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0" stop-color="#171a23"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="ring-outer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a9ff"/>
      <stop offset="1" stop-color="#9e6bfa"/>
    </linearGradient>
    <linearGradient id="ring-inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e6bfa"/>
      <stop offset="1" stop-color="#58a9ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="95" fill="url(#bg)"/>
  <path d="M256 88 A168 168 0 1 0 424 256" fill="none" stroke="url(#ring-outer)" stroke-width="48" stroke-linecap="round"/>
  <path d="M256 340 A84 84 0 1 1 172 256" fill="none" stroke="url(#ring-inner)" stroke-width="48" stroke-linecap="round"/>
  <rect width="512" height="512" rx="95" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" x="1" y="1"/>
</svg>
