[package]
name = "arc-app"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[dependencies]
arc-core = { path = "../arc-core" }
arc-geometry = { path = "../arc-geometry" }
arc-modeling = { path = "../arc-modeling" }
arc-architecture = { path = "../arc-architecture" }
arc-plugin = { path = "../arc-plugin" }
arc-commands = { path = "../arc-commands" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
nalgebra = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
indexmap = { workspace = true }
smallvec = "1.10"
tokio = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-store = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2.0"
wgpu = { version = "23.0", features = ["wgsl"] }
wgpu-types = "23.0"
bytemuck = { workspace = true }
glam = "0.26"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
ron = "0.8"
bincode = "1.3"

[features]
default = []

[build-dependencies]
tauri = "2.0"
tauri-build = { version = "2.0", features = [] }

[[bin]]
name = "arc"
path = "src/main.rs"
