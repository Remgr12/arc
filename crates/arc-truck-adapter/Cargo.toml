[package]
name = "arc-truck-adapter"
version = "0.7.0"
edition = "2024"

[dependencies]
# Core dependencies
anyhow = { workspace = true }
arc-core = { path = "../arc-core", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Truck dependencies (when not using arc-core)
truck = { git = "https://github.com/ricosjp/truck.git", rev = "master", optional = true }
truck-base = { git = "https://github.com/ricosjp/truck.git", rev = "master", optional = true }
truck-geometry = { git = "https://github.com/ricosjp/truck.git", rev = "master", optional = true }
truck-topology = { git = "https://github.com/ricosjp/truck.git", rev = "master", optional = true }
truck-modeling = { git = "https://github.com/ricosjp/truck.git", rev = "master", optional = true }
truck-shapeops = { git = "https://github.com/ricosjp/truck.git", rev = "master", optional = true }
truck-meshalgo = { git = "https://github.com/ricosjp/truck.git", rev = "master", optional = true }

# Optional for performance
cgmath = "0.18"
nalgebra = { workspace = true }

[features]
default = ["with-truck"]
with-arc-core = ["dep:arc-core"]
with-truck = ["dep:truck", "dep:truck-base", "dep:truck-geometry", "dep:truck-topology", "dep:truck-modeling", "dep:truck-shapeops", "dep:truck-meshalgo"]
full = ["with-arc-core", "with-truck", "formats", "modeling", "topology"]
formats = []
modeling = []
topology = []

[dev-dependencies]
tempfile = "3.0"
test-case = "3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["full"]
full = ["formats", "modeling", "topology"]
formats = ["format-gltf", "format-stl", "format-obj"]
format-gltf = []
format-stl = []
format-obj = []
modeling = ["bool-ops"]
bool-ops = []
topology = ["full-topology"]
full-topology = []

[workspace]
