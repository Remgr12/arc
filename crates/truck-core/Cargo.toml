[package]
name = "truck-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "truck-core"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
uuid = { version = "1.0", features = ["v4", "serde"], workspace = true }
nalgebra = { version = "0.35", features = ["serde-serialize"], workspace = true }
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", features = ["serde"], workspace = true }

[dev-dependencies]
rusty_fork = "0.5.0"

[workspace]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remgr12/arc"
authors = ["Zsombor Simon"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
unused_mut = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
incremental = true
