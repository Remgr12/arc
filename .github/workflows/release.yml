name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows (MSI + Portable)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          choco install nsis -y
          dotnet tool install -g wix
          echo "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (MSI + NSIS)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          projectPath: src-tauri
          args: --target x86_64-pc-windows-msvc --bundles msi,nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'tauri_[platform]-[arch]-[bundle]'

  build-linux:
    name: Build Linux (AppImage + DEB + RPM + Flatpak)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libpng-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            flatpak-builder \
            flatpak \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (AppImage + DEB + RPM)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          projectPath: src-tauri
          args: --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'tauri_[platform]-[arch]-[bundle]'

      - name: Install Flatpak runtime
        working-directory: ${{ github.workspace }}
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08

      - name: Build Flatpak
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p flatpak/payload/target/release flatpak/payload/src-tauri flatpak/payload/flatpak
          cp target/x86_64-unknown-linux-gnu/release/arc flatpak/payload/target/release/
          cp src-tauri/tauri.conf.json flatpak/payload/src-tauri/
          cp flatpak/com.arc.cad.desktop flatpak/com.arc.cad.metainfo.xml flatpak/payload/flatpak/
          cp -r flatpak/icons flatpak/payload/flatpak/icons
          cd flatpak
          flatpak-builder --force-clean --repo=repo build-dir com.arc.cad.yml
          flatpak build-bundle repo arc-${{ github.ref_name }}.flatpak com.arc.cad

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: flatpak/arc-${{ github.ref_name }}.flatpak

      - name: Create Flatpak repository
        working-directory: ${{ github.workspace }}
        run: |
          cd flatpak
          flatpak build-update-repo --title="arc" --generate-static-deltas --prune-depth=20 repo

      - name: Upload Flatpak repo
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak/repo

  build-macos:
    name: Build macOS (DMG + App)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (Universal DMG)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          projectPath: src-tauri
          args: --target universal-apple-darwin --bundles dmg,app
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'tauri_[platform]-[arch]-[bundle]'

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download tauri artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'tauri_*'
          merge-multiple: true
          path: dist

      - name: Download Flatpak
        uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist/flatpak

      - name: Download Flatpak repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: dist/flatpak-repo

      - name: Publish release (tauri draft -> latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "unexpected tag $TAG"; exit 1 ;;
          esac
          # Only keep glob matches that actually exist; unmatched patterns
          # would otherwise be passed literally and crash the upload loop.
          FILES=()
          for pattern in dist/*.msi dist/*.exe dist/*.AppImage dist/*.deb \
                         dist/*.rpm dist/*.dmg dist/*.app.tar.gz \
                         dist/flatpak/*.flatpak dist/*.sig; do
            for f in $pattern; do
              [ -f "$f" ] && FILES+=("$f")
            done
          done
          echo "release files: ${FILES[*]:-none}"

          # tauri-action creates a draft for the tag; drafts never resolve by
          # tag lookup, so find it by listing releases.
          DRAFT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '([.[] | select(.draft and .tag_name == "'"$TAG"'")][0].id) // empty')

          if [ -n "$DRAFT_ID" ]; then
            UPLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
              --jq '.upload_url' | sed 's/{.*$//')
            # tauri-action may already have uploaded most assets to the draft;
            # only upload what is missing, then publish the draft.
            EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
              --jq '[.assets[].name] | join("\n")')
            for f in "${FILES[@]}"; do
              name=$(basename "$f")
              if grep -qx "$name" <<<"$EXISTING"; then
                echo "already in draft: $name"
                continue
              fi
              echo "uploading $name"
              gh api --method POST "$UPLD?name=$name" \
                --input "$f" >/dev/null \
                -H "Content-Type: application/octet-stream"
            done
          else
            echo "no draft for $TAG; creating a release instead"
            gh release create "$TAG" "${FILES[@]}" --title "$TAG" \
              --latest --generate-notes
            DRAFT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
          fi

          # Replace the updater manifest: each tauri-action run only lists its
          # own platform inside latest.json, so one merged manifest covering
          # all platforms is assembled here from the .sig assets. Flatpak has
          # its own update channel via the Flatpak repo and is not included.
          python3 - "$TAG" <<'PY'
          import datetime, glob, json, os, sys

          tag = sys.argv[1]
          dist = "dist"
          assets = sorted(os.listdir(dist))

          def pick(pattern):  # pattern -> asset name whose key it is
              winners = [a for a in assets if glob.fnmatch.fnmatch(a, pattern) and not a.endswith(".sig")]
              return winners[-1] if winners else None

          def sig_of(asset):
              s = asset + ".sig"
              if s in assets:
                  with open(os.path.join(dist, s), encoding="utf-8") as f:
                      return f.read()
              return None

          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          platforms = {}
          for win in (pick("*-setup.exe"), pick("*.msi")):
              if win and sig_of(win):
                  platforms["windows-x86_64"] = {
                      "artifactName": win,
                      "signature": sig_of(win),
                      "url": f"{base}/{win}",
                  }
                  break
          for mac in (pick("*.app.tar.gz"),):
              if mac and sig_of(mac):
                  for key in ("darwin-aarch64", "darwin-x86_64"):
                      platforms[key] = {"artifactName": mac, "signature": sig_of(mac), "url": f"{base}/{mac}"}
          linux = pick("*.AppImage")
          if linux and sig_of(linux):
              platforms["linux-x86_64"] = {"artifactName": linux, "signature": sig_of(linux), "url": f"{base}/{linux}"}

          if not platforms:
              print("no updater artifacts found; skipping latest.json")
              sys.exit(0)
          manifest = {
              "version": tag[1:],
              "notes": f"arc {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open(os.path.join(dist, "latest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print("latest.json:", list(platforms))
          PY

          if [ -f dist/latest.json ]; then
            UPLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
              --jq '.upload_url' | sed 's/{.*$//')
            # drop the partial per-platform manifests the build jobs uploaded,
            # then publish the merged one
            for name in $(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
              --jq '.assets[].name' | grep -x "latest.json" || true); do
              ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
                --jq '.assets[] | select(.name == "latest.json") | .id')
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" >/dev/null
            done
            gh api --method POST "$UPLD?name=latest.json" \
              --input dist/latest.json >/dev/null \
              -H "Content-Type: application/octet-stream"
          fi

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
            -F draft=false -F prerelease=false -F make_latest=true \
            -F generate_release_notes=true >/dev/null
          echo "published release for $TAG"

  flatpak-repo-update:
    name: Update Flatpak Repository
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Flatpak repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak-repo

      - name: Deploy Flatpak repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flatpak-repo/repo
          destination_dir: flatpak-repo
          keep_files: true