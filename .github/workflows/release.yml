name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows (MSI + Portable)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/arc-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          choco install nsis -y
          dotnet tool install -g wix
          echo "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build frontend
        working-directory: ../../frontend
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (MSI + NSIS)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'arc ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          projectPath: crates/arc-app
          args: --target x86_64-pc-windows-msvc --bundle msi,nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'tauri-artifacts'

  build-linux:
    name: Build Linux (AppImage + DEB + RPM + Flatpak)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/arc-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libpng-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            flatpak-builder \
            flatpak \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build frontend
        working-directory: ../../frontend
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (AppImage + DEB + RPM)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'arc ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          projectPath: crates/arc-app
          args: --target x86_64-unknown-linux-gnu --bundle appimage,deb,rpm
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'tauri-artifacts'

      - name: Build Flatpak
        run: |
          cd ../../flatpak
          flatpak-builder --force-clean --repo=repo build-dir com.arc.cad.yml
          flatpak build-bundle repo arc-${{ github.ref_name }}.flatpak com.arc.cad

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ../../flatpak/arc-${{ github.ref_name }}.flatpak

      - name: Create Flatpak repository
        run: |
          cd ../../flatpak
          flatpak build-update-repo --title="arc CAD" --generate-static-deltas --prune-depth=20 repo

      - name: Upload Flatpak repo
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: ../../flatpak/repo

  build-macos:
    name: Build macOS (DMG + App)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/arc-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build frontend
        working-directory: ../../frontend
        run: |
          npm ci
          npm run build

      - name: Build Tauri app (Universal DMG)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'arc ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          projectPath: crates/arc-app
          args: --target universal-apple-darwin --bundle dmg,app
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'tauri-artifacts'

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-artifacts
          path: dist/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-artifacts
          path: dist/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-artifacts
          path: dist/macos

      - name: Download Flatpak
        uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist/flatpak

      - name: Download Flatpak repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: dist/flatpak-repo

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/windows/*.msi
            dist/windows/*.exe
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/macos/*.dmg
            dist/macos/*.app.tar.gz
            dist/flatpak/*.flatpak
          draft: false
          prerelease: false
          generate_release_notes: true

  flatpak-repo-update:
    name: Update Flatpak Repository
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Flatpak repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak-repo

      - name: Deploy Flatpak repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flatpak-repo/repo
          destination_dir: flatpak-repo
          keep_files: true