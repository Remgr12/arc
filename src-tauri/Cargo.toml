[package]
name = "arc-app"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

nalgebra = { workspace = true }

# richosjp/truck kernel (vendored upstream in ../crates/truck)
truck-modeling = { path = "../crates/truck/truck-modeling" }
truck-shapeops = { path = "../crates/truck/truck-shapeops" }
truck-stepio = { path = "../crates/truck/truck-stepio" }
truck-meshalgo = { path = "../crates/truck/truck-meshalgo", default-features = false, features = [
    "analyzers",
    "filters",
    "tessellation",
] }
truck-polymesh = { path = "../crates/truck/truck-polymesh" }
truck-geometry = { path = "../crates/truck/truck-geometry" }
truck-topology = { path = "../crates/truck/truck-topology" }
truck-base = { path = "../crates/truck/truck-base" }
truck-geotrait = { path = "../crates/truck/truck-geotrait" }
cgmath = "0.18"

tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }

mlua = { version = "0.12", features = ["lua54", "vendored", "serialize", "send"], optional = true }

[[bin]]
name = "arc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[features]
default = ["lua"]
lua = ["dep:mlua"]
