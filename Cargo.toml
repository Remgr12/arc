[workspace]
resolver = "2"
members = [
    "crates/arc-core",
    "crates/arc-geometry",
    "crates/arc-modeling",
    "crates/arc-architecture",
    "crates/arc-plugin",
    "crates/arc-app",
    "crates/arc-commands",
]
exclude = ["frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/arc"
authors = ["ARC Contributors"]

[workspace.dependencies]
# Truck CAD kernel
truck-geometry = "0.5"
truck-topology = "0.6"
truck-modeling = "0.6"
truck-base = "0.5"
truck-polymesh = "0.6"
truck-meshalgo = "0.4"
truck-stepio = "0.3"
monstertruck-fillet = "0.4"
monstertruck-healing = "0.4"
monstertruck = { version = "0.4", features = ["modeling", "meshing", "step"] }

# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
parking_lot = "0.12"
dashmap = "5.5"
indexmap = "2.0"
smallvec = "1.10"

# Async/runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
ron = "0.8"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tauri
tauri = { version = "2.0", features = ["macros"] }
tauri-plugin-store = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2.0"

# WebGPU/wgpu
wgpu = { version = "23.0", features = ["wgsl"] }
wgpu-types = "23.0"
bytemuck = "1.14"

# Math
glam = "0.26"

# File formats
gltf = "0.16"
dxf = "0.6"

# UI
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
unused_mut = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
