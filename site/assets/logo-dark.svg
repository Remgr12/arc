<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    arc logo — two concentric 270 degree rings.
    The outer ring is missing its top-right (north-east) quarter,
    the inner ring its diametrically opposite (south-west) quarter.
    Inner ring: centerline radius 72, drawn from west (184,256) clockwise
    through north and east, ending at south (256,328); the 90-180 span
    (south to west) is left open.
    This variant is tuned for light backgrounds.
  -->
  <title>arc</title>
  <defs>
    <linearGradient id="ring-outer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6ef2"/>
      <stop offset="1" stop-color="#7b35f0"/>
    </linearGradient>
    <linearGradient id="ring-inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b35f0"/>
      <stop offset="1" stop-color="#1f6ef2"/>
    </linearGradient>
  </defs>
  <path d="M256 96 A160 160 0 1 0 416 256" fill="none" stroke="url(#ring-outer)" stroke-width="48" stroke-linecap="round"/>
  <path d="M184 256 A72 72 0 1 1 256 328" fill="none" stroke="url(#ring-inner)" stroke-width="48" stroke-linecap="round"/>
</svg>
